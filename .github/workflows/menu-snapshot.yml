name: Menu snapshot (temporary)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s && git init -q && git checkout -q -b menu-snapshot
          curl -sS "https://qmblccwyxbpvziiwrlne.supabase.co/rest/v1/site_docs?select=path,data&path=like.site/*" -H "apikey: sb_publishable_Nbp1K_Co8tDVB-jNjBRs3w_D40qm4Mg" -o site_docs.json
          curl -sSL "https://edencny.com/" -o live_index.html || true
          curl -sSL "https://edencny.com/js/beef-cuts.js?v=20261030a" -o live_beef.js || true
          curl -sSIL "https://edencny.com/js/app.js?v=20261030a" -o live_app_headers.txt || true
          curl -sSL "https://edencny.com/js/app.js?v=20261030a" -o live_app.js || true
          git add -A && git -c user.name=snap -c user.email=snap@example.com commit -qm snapshot
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" menu-snapshot
