name: whois-check
on: push
permissions:
  contents: write
jobs:
  w:
    if: "!contains(github.event.head_commit.message, 'whois result')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq install -y whois >/dev/null 2>&1 || true
          { whois edencny.com | sed -n '1,90p'
            echo ==== RDAP; curl -s https://rdap.verisign.com/com/v1/domain/edencny.com
            echo; echo ==== DNS; dig +short NS edencny.com; dig +short A edencny.com; dig +short MX edencny.com; } > whois.txt 2>&1
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add whois.txt; git commit -qm "whois result"; git push
