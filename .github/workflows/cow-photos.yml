name: Cow photo cutout (temporary)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install -q "rembg[cpu]==2.0.59" pillow
          mkdir s && cd s && git init -q && git checkout -q -b cow-photos
          curl -sSL -A "EdenSite/1.0 (info@edencny.com)" "https://upload.wikimedia.org/wikipedia/commons/2/2b/Hereford67-300.jpg" -o hereford.jpg
          python - <<'PY'
          from rembg import remove, new_session
          from PIL import Image
          im=Image.open('hereford.jpg').convert('RGB')
          for m in ['isnet-general-use','u2net']:
              try:
                  out=remove(im,session=new_session(m),alpha_matting=True)
                  bb=out.getbbox(); out=out.crop(bb); out.save('cut-'+m+'.png'); print(m,out.size)
              except Exception as e: print(m,e)
          PY
          git add -A && git -c user.name=snap -c user.email=snap@example.com commit -qm cutout
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cow-photos
