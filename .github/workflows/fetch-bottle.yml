name: Temporary data job
on:
  push:
    branches: [tmp-fetch-bottle]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash tmp/run.sh
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f out && git commit -m "results [skip ci]" && git pull --rebase origin tmp-fetch-bottle && git push origin HEAD:tmp-fetch-bottle
