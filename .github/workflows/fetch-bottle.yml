name: Fetch map data (temporary)
on:
  push:
    branches: [tmp-fetch-bottle]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p map/tiles && cd map
          python3 - <<'PY'
          import math, urllib.request, urllib.parse
          z=12; W,E,S,N=1.10,2.48,41.10,41.76
          def tx(l): return int((l+180)/360*2**z)
          def ty(a):
              r=math.radians(a); return int((1-math.log(math.tan(r)+1/math.cos(r))/math.pi)/2*2**z)
          for x in range(tx(W),tx(E)+1):
              for y in range(ty(N),ty(S)+1):
                  u=f"https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
                  try: urllib.request.urlretrieve(u,f"tiles/{z}_{x}_{y}.png")
                  except Exception as e: print('fail',u,e)
          q='[out:json][timeout:90];(way["waterway"="river"](41.10,1.10,41.76,2.48);node["place"~"^(city|town)$"](41.10,1.10,41.76,2.48);node["natural"="peak"](41.55,1.75,41.65,1.90););out geom;'
          for host in ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]:
              try:
                  req=urllib.request.Request(host,data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':'eden-map/1.0'})
                  open('osm.json','wb').write(urllib.request.urlopen(req,timeout=120).read()); break
              except Exception as e: print('overpass fail',host,e)
          PY
          ls tiles | wc -l; ls -la
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f map && git commit -m "fetched [skip ci]" && git push origin HEAD:tmp-fetch-bottle
