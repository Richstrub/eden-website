name: Temporary data job
on:
  push:
    branches: [tmp-fetch-bottle]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data
          key: mapdata-${{ hashFiles('tmp/regions.json') }}
          restore-keys: mapdata-
      - run: bash tmp/run.sh
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f out && git checkout -- tmp 2>/dev/null; git commit -m "results [skip ci]" && git pull --rebase origin tmp-fetch-bottle && git push origin HEAD:tmp-fetch-bottle
